# =============================================================================
# VBS Ticketing System - Development Docker Compose
# Use: docker-compose -f docker-compose.dev.yml up
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database (Development)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: vbs-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: vbs_user
      POSTGRES_PASSWORD: vbs_password
      POSTGRES_DB: vbs_ticketing
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Using 5433 externally to avoid conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbs_user -d vbs_ticketing"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Adminer (Database GUI)
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: vbs-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"  # Using 8081 to avoid conflicts
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  postgres_dev_data:
    driver: local

networks:
  default:
    name: vbs-dev-network

