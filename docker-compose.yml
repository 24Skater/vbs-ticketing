# =============================================================================
# VBS Ticketing System - Docker Compose
# Development environment with hot reload
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: vbs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-vbs_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vbs_password}
      POSTGRES_DB: ${DB_NAME:-vbs_ticketing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vbs_user} -d ${DB_NAME:-vbs_ticketing}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # VBS Ticketing Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vbs-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-vbs_user}:${DB_PASSWORD:-vbs_password}@db:5432/${DB_NAME:-vbs_ticketing}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      HUBTEL_API_ID: ${HUBTEL_API_ID}
      HUBTEL_API_KEY: ${HUBTEL_API_KEY}
      HUBTEL_POS_SALES_ID: ${HUBTEL_POS_SALES_ID}
      HUBTEL_CALLBACK_URL: ${HUBTEL_CALLBACK_URL}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: vbs-network

